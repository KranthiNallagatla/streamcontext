<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>StreamContext</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    width: 340px;
    background: #080812;
    color: #e8e8f0;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
    font-size: 13px;
  }

  .header {
    padding: 18px 20px 14px;
    background: linear-gradient(135deg, #0d0d1f, #080812);
    border-bottom: 1px solid rgba(0,200,255,0.1);
    position: relative;
    overflow: hidden;
  }

  .header::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, #00c8ff, transparent);
  }

  .logo-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 4px;
  }

  .logo {
    font-size: 22px;
    filter: drop-shadow(0 0 8px rgba(0,200,255,0.7));
  }

  .brand {
    font-size: 16px;
    font-weight: 800;
    letter-spacing: -0.3px;
    background: linear-gradient(135deg, #00c8ff, #0070f3);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .version {
    font-size: 10px;
    color: #444;
    margin-left: auto;
  }

  .tagline {
    font-size: 11px;
    color: #555;
    letter-spacing: 0.2px;
  }

  /* Service Status */
  .status-card {
    margin: 14px 16px;
    padding: 12px 14px;
    background: #0d0d1f;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.06);
  }

  .status-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .status-left {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    transition: all 0.3s;
  }

  .dot-green {
    background: #00d4aa;
    box-shadow: 0 0 8px rgba(0,212,170,0.6);
    animation: pulse-green 2s ease-in-out infinite;
  }

  .dot-red { background: #ff4757; }
  .dot-yellow { background: #f59e0b; animation: pulse-yellow 1s ease-in-out infinite; }

  @keyframes pulse-green {
    0%,100% { box-shadow: 0 0 4px rgba(0,212,170,0.4); }
    50% { box-shadow: 0 0 12px rgba(0,212,170,0.8); }
  }

  @keyframes pulse-yellow {
    0%,100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  .status-label {
    font-size: 13px;
    font-weight: 600;
    color: #e8e8f0;
  }

  .status-sub {
    font-size: 10px;
    color: #555;
    margin-top: 2px;
  }

  .start-btn {
    font-size: 10px;
    padding: 4px 10px;
    background: rgba(0,200,255,0.1);
    border: 1px solid rgba(0,200,255,0.2);
    border-radius: 6px;
    color: #00c8ff;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }

  .start-btn:hover {
    background: rgba(0,200,255,0.15);
  }

  /* Stats */
  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    margin: 0 16px 14px;
  }

  .stat {
    background: #0d0d1f;
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 8px;
    padding: 10px 8px;
    text-align: center;
  }

  .stat-num {
    font-size: 20px;
    font-weight: 800;
    color: #00c8ff;
    line-height: 1;
  }

  .stat-label {
    font-size: 9px;
    color: #555;
    margin-top: 3px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  /* Actions */
  .actions {
    padding: 0 16px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .btn-main {
    width: 100%;
    padding: 10px;
    background: linear-gradient(135deg, #00c8ff, #0070f3);
    border: none;
    border-radius: 9px;
    color: #000;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .btn-main:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(0,200,255,0.3);
  }

  .btn-main:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none;
  }

  .btn-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .btn-secondary {
    padding: 8px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 8px;
    color: #888;
    font-size: 11px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
  }

  .btn-secondary:hover {
    background: rgba(255,255,255,0.07);
    color: #ccc;
  }

  /* Divider */
  .divider {
    height: 1px;
    background: rgba(255,255,255,0.05);
    margin: 4px 16px 12px;
  }

  /* Setup instructions */
  .setup-box {
    margin: 0 16px 14px;
    padding: 12px 14px;
    background: rgba(255,71,87,0.06);
    border: 1px solid rgba(255,71,87,0.15);
    border-radius: 10px;
  }

  .setup-title {
    font-size: 12px;
    font-weight: 700;
    color: #ff6b7a;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .setup-cmd {
    background: #070710;
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 6px;
    padding: 8px 10px;
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 10px;
    color: #00c8ff;
    cursor: pointer;
    word-break: break-all;
    transition: all 0.2s;
  }

  .setup-cmd:hover {
    background: rgba(0,200,255,0.05);
    border-color: rgba(0,200,255,0.15);
  }

  .setup-hint {
    font-size: 10px;
    color: #555;
    margin-top: 6px;
  }

  /* Footer */
  .footer {
    padding: 10px 16px;
    border-top: 1px solid rgba(255,255,255,0.05);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .footer-links {
    display: flex;
    gap: 12px;
  }

  .footer-link {
    font-size: 10px;
    color: #444;
    text-decoration: none;
    transition: color 0.2s;
    cursor: pointer;
    background: none;
    border: none;
    font-family: inherit;
    padding: 0;
  }

  .footer-link:hover { color: #00c8ff; }

  .footer-version {
    font-size: 10px;
    color: #333;
  }
</style>
</head>
<body>

<div class="header">
  <div class="logo-row">
    <span class="logo">🌊</span>
    <span class="brand">StreamContext</span>
    <span class="version">v2.0</span>
  </div>
  <div class="tagline">Never lose your AI conversation context</div>
</div>

<div class="status-card">
  <div class="status-row">
    <div class="status-left">
      <div class="status-dot dot-yellow" id="status-dot"></div>
      <div>
        <div class="status-label" id="status-label">Connecting...</div>
        <div class="status-sub" id="status-sub">Checking local service</div>
      </div>
    </div>
    <button class="start-btn" id="start-btn" style="display:none">Start Service</button>
  </div>
</div>

<div id="stats-section" style="display:none">
  <div class="stats">
    <div class="stat">
      <div class="stat-num" id="stat-convs">0</div>
      <div class="stat-label">Convos</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="stat-msgs">0</div>
      <div class="stat-label">Messages</div>
    </div>
    <div class="stat">
      <div class="stat-num">🔒</div>
      <div class="stat-label">Local</div>
    </div>
  </div>
</div>

<div id="setup-section" style="display:none">
  <div class="setup-box">
    <div class="setup-title">⚠️ Service not running</div>
    <div class="setup-cmd" id="setup-cmd" title="Click to copy">
      cd ~/streamcontext/service && python3 main.py
    </div>
    <div class="setup-hint">Click command to copy, then paste in Terminal</div>
  </div>
</div>

<div class="divider"></div>

<div class="actions">
  <button class="btn-main" id="btn-archive">
    📚 Open Archive
  </button>
  <div class="btn-row">
    <button class="btn-secondary" id="btn-github">
      🐙 GitHub
    </button>
    <button class="btn-secondary" id="btn-settings">
      ⚙️ Settings
    </button>
  </div>
</div>

<div class="footer">
  <div class="footer-links">
    <button class="footer-link" id="btn-docs">Docs</button>
    <button class="footer-link" id="btn-feedback">Feedback</button>
  </div>
  <span class="footer-version">StreamContext v2.0</span>
</div>

<script src="popup.js"></script>
</body>
</html>
